<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#090d16"/>
            <stop offset="50%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#1e1e38"/>
        </linearGradient>
        <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="50%" stop-color="#818cf8"/>
            <stop offset="100%" stop-color="#c084fc"/>
        </linearGradient>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect width="800" height="340" rx="16" fill="url(#bg-grad)"/>
    <rect width="800" height="340" rx="16" fill="url(#grid)"/>
    <rect x="0.5" y="0.5" width="799" height="339" rx="15.5" fill="none" stroke="#334155" stroke-opacity="0.5"/>

    <!-- Header / Banner Info -->
    <g transform="translate(40, 36)">
        <rect x="0" y="0" width="110" height="22" rx="11" fill="#0369a1" fill-opacity="0.3"/>
        <rect x="0.5" y="0.5" width="109" height="21" rx="10.5" fill="none" stroke="#38bdf8" stroke-opacity="0.5"/>
        <text x="55" y="15" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="0.5">CONTEXT OPTIMIZATION</text>

        <text x="0" y="48" fill="#f8fafc" font-size="22" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Web Content Distiller</text>
        <text x="0" y="72" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Zero-dependency web page scraper and DOM condenser outputting clean Markdown for web AI agents</text>
    </g>

    <!-- Metric pill on right -->
    <g transform="translate(630, 42)">
        <rect x="0" y="0" width="130" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="65" y="18" fill="#64748b" font-size="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">VERIFIED STATUS</text>
        <text x="65" y="34" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">v0.1.0 • Passing</text>
    </g>

    <!-- Architecture Nodes -->
    
        <g id="node-1">
            <rect x="40" y="140" width="165" height="160" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
            <rect x="40" y="140" width="165" height="38" rx="10" fill="#0f172a" fill-opacity="0.6"/>
            <rect x="40" y="176" width="165" height="2" fill="#38bdf8" fill-opacity="0.8"/>
            <text x="54" y="164" fill="#f8fafc" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Raw HTML Ingress</text>
            
            <circle cx="58" cy="201" r="3" fill="#38bdf8"/>
            <text x="68" y="205" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">HTML source stream</text>
            
            <circle cx="58" cy="227" r="3" fill="#38bdf8"/>
            <text x="68" y="231" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Header & script tags</text>
            
            <circle cx="58" cy="253" r="3" fill="#38bdf8"/>
            <text x="68" y="257" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Navbars & footer boilerplate</text>
            
        </g>
        
            <g opacity="0.8">
                <line x1="209" y1="210" x2="221" y2="210" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,3"/>
                <polygon points="223,210 218,206 218,214" fill="#0284c7"/>
            </g>
            
        

        <g id="node-2">
            <rect x="225" y="140" width="165" height="160" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
            <rect x="225" y="140" width="165" height="38" rx="10" fill="#0f172a" fill-opacity="0.6"/>
            <rect x="225" y="176" width="165" height="2" fill="#38bdf8" fill-opacity="0.8"/>
            <text x="239" y="164" fill="#f8fafc" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">DOM Pruner</text>
            
            <circle cx="243" cy="201" r="3" fill="#38bdf8"/>
            <text x="253" y="205" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Strip <script> and <style></text>
            
            <circle cx="243" cy="227" r="3" fill="#38bdf8"/>
            <text x="253" y="231" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Remove cookie banners</text>
            
            <circle cx="243" cy="253" r="3" fill="#38bdf8"/>
            <text x="253" y="257" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Isolate <article> / <main></text>
            
        </g>
        
            <g opacity="0.8">
                <line x1="394" y1="210" x2="406" y2="210" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,3"/>
                <polygon points="408,210 403,206 403,214" fill="#0284c7"/>
            </g>
            
        

        <g id="node-3">
            <rect x="410" y="140" width="165" height="160" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
            <rect x="410" y="140" width="165" height="38" rx="10" fill="#0f172a" fill-opacity="0.6"/>
            <rect x="410" y="176" width="165" height="2" fill="#38bdf8" fill-opacity="0.8"/>
            <text x="424" y="164" fill="#f8fafc" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Markdown Transpiler</text>
            
            <circle cx="428" cy="201" r="3" fill="#38bdf8"/>
            <text x="438" y="205" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Convert headings to #</text>
            
            <circle cx="428" cy="227" r="3" fill="#38bdf8"/>
            <text x="438" y="231" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Format links [text](url)</text>
            
            <circle cx="428" cy="253" r="3" fill="#38bdf8"/>
            <text x="438" y="257" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Preserve code blocks</text>
            
        </g>
        
            <g opacity="0.8">
                <line x1="579" y1="210" x2="591" y2="210" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,3"/>
                <polygon points="593,210 588,206 588,214" fill="#0284c7"/>
            </g>
            
        

        <g id="node-4">
            <rect x="595" y="140" width="165" height="160" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
            <rect x="595" y="140" width="165" height="38" rx="10" fill="#0f172a" fill-opacity="0.6"/>
            <rect x="595" y="176" width="165" height="2" fill="#38bdf8" fill-opacity="0.8"/>
            <text x="609" y="164" fill="#f8fafc" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Clean Agent Context</text>
            
            <circle cx="613" cy="201" r="3" fill="#38bdf8"/>
            <text x="623" y="205" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Distilled Markdown text</text>
            
            <circle cx="613" cy="227" r="3" fill="#38bdf8"/>
            <text x="623" y="231" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">70-85% token reduction</text>
            
            <circle cx="613" cy="253" r="3" fill="#38bdf8"/>
            <text x="623" y="257" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">High semantic density</text>
            
        </g>
        
        

    <!-- Footer Flow Indicator -->
    <g transform="translate(40, 315)">
        <text x="0" y="10" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Antigravity Autonomous Engineering Pipeline • High-Throughput Production Architecture</text>
    </g>
</svg>